<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>Yusuf — Reading & Listening Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Literata:ital,wght@0,400;0,500;1,400&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110e; --bg2:#1d1813; --ink:#ece5d8; --ink-dim:#a89c87;
    --amber:#e9b44c; --amber-soft:#f0c674; --line:#322a20;
    --en:'Literata',Georgia,serif; --disp:'Fraunces',Georgia,serif; --ar:'Noto Naskh Arabic',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%, #241d15 0%, var(--bg) 55%) fixed,var(--bg);
    color:var(--ink);font-family:var(--en);display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none}
  header{padding:14px 18px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg),rgba(20,17,14,.85));backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:space-between}
  .brand .l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:1.25rem;margin:0}
  .brand .ar{font-family:var(--ar);color:var(--amber-soft);font-size:.95rem}
  .gear{background:none;border:none;color:var(--ink-dim);cursor:pointer;padding:4px;line-height:0}
  .gear svg{width:22px;height:22px;fill:currentColor}
  .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:999px;
    font:inherit;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .chip:active{transform:scale(.96)}
  .chip.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .chip select{background:transparent;border:none;color:inherit;font:inherit;outline:none}
  .dot{width:8px;height:8px;border-radius:50%;background:#5a4f3d}
  .chip.on .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .speedchip{cursor:default;padding:6px 14px;gap:9px}
  .speedchip .splabel{font-size:.8rem;white-space:nowrap}
  .speedchip .splabel b{color:var(--amber);font-weight:700}
  .speedchip .sphint{font-size:.62rem;opacity:.55;white-space:nowrap}
  input[type=range]#sp{-webkit-appearance:none;appearance:none;width:96px;height:22px;background:transparent;cursor:pointer;margin:0}
  #sp::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--amber),#5a4f3d)}
  #sp::-moz-range-track{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--amber),#5a4f3d)}
  #sp::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber),0 1px 3px #000;border:2px solid var(--bg)}
  #sp::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);border:2px solid var(--bg)}
  main{flex:1;overflow-y:auto;padding:8px 18px 150px;scroll-behavior:smooth}
  .wrap{max-width:680px;margin:0 auto}
  .chap{margin:30px 0 6px}
  .chap .n{font-family:var(--disp);font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--amber)}
  .chap h2{font-family:var(--disp);font-weight:600;font-size:1.35rem;margin:2px 0;font-style:italic}
  .chap .h-ar{font-family:var(--ar);color:var(--ink-dim);font-size:1rem}
  .dl{margin-top:8px;border:1px solid var(--line);background:var(--bg2);color:var(--amber-soft);
    padding:5px 12px;border-radius:999px;font:inherit;font-size:.76rem;cursor:pointer}
  .dl.done{color:#7bd88f;border-color:#2f5236}
  .seg{padding:10px 12px;margin:4px -12px;border-radius:12px;border-left:2px solid transparent;transition:background .25s,border-color .25s}
  .seg.active{background:rgba(233,180,76,.06);border-left-color:var(--amber)}
  p.en{font-size:1.18rem;line-height:1.95;margin:0}
  p.ar{font-family:var(--ar);font-size:1.05rem;line-height:2.1;color:var(--ink-dim);margin:6px 0 0;direction:rtl;text-align:right}
  body.no-ar p.ar{display:none}
  .w{cursor:pointer;border-radius:5px;padding:0 1px;transition:background .12s,color .12s}
  .w:hover{background:rgba(233,180,76,.12)}
  .w.active{background:var(--amber);color:#1a1206;font-weight:500;box-shadow:0 0 14px rgba(233,180,76,.55);border-radius:6px}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(rgba(20,17,14,.4),var(--bg2));
    border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .prog{height:4px;background:#2a2218;border-radius:9px;overflow:hidden;margin-bottom:9px}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber-soft));transition:width .2s linear}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:18px;max-width:680px;margin:0 auto}
  .ctrls .meta{flex:1;font-size:.74rem;color:var(--ink-dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ctrls .meta b{color:var(--ink);font-weight:500}
  .btn{background:none;border:none;color:var(--ink);cursor:pointer;padding:6px;line-height:0}
  .btn:active{transform:scale(.9)}
  .btn svg{width:26px;height:26px;fill:currentColor}
  .play{width:56px;height:56px;border-radius:50%;background:var(--amber);color:#1a1206;display:grid;place-items:center;box-shadow:0 6px 22px rgba(233,180,76,.35)}
  .play svg{width:28px;height:28px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:9}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg2);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(110%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:680px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  .sheet.show{transform:translateY(0)}
  .sheet .grab{width:38px;height:4px;background:#3a3025;border-radius:9px;margin:0 auto 14px}
  .sheet .word{display:flex;align-items:center;gap:12px}
  .sheet .word h3{font-family:var(--disp);font-size:1.6rem;margin:0;font-weight:600}
  .spk{width:42px;height:42px;border-radius:50%;border:1px solid var(--amber);background:rgba(233,180,76,.1);color:var(--amber);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .spk:active{transform:scale(.92)} .spk svg{width:21px;height:21px;fill:currentColor}
  .mean{font-family:var(--ar);direction:rtl;text-align:right;font-size:1.35rem;color:var(--amber-soft);margin:14px 0 4px;min-height:1.4em}
  .def{font-size:.92rem;color:var(--ink-dim);line-height:1.6;margin-top:8px}
  .def i{color:var(--amber);font-style:normal;font-size:.78rem;letter-spacing:1px;text-transform:uppercase}
  /* settings */
  .set{direction:rtl;text-align:right}
  .set h3{font-family:var(--ar);margin:0 0 12px;font-size:1.15rem}
  .set label{display:block;font-family:var(--ar);font-size:.85rem;color:var(--ink-dim);margin:12px 0 5px}
  .set input,.set select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0f0d0a;color:var(--ink);font:inherit;font-size:.9rem;outline:none}
  .set .row{display:flex;gap:10px} .set .row>div{flex:1}
  .set .note{font-family:var(--ar);font-size:.78rem;color:var(--ink-dim);line-height:1.6;background:rgba(233,180,76,.06);
    border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:14px}
  .set .acts{display:flex;gap:10px;margin-top:16px}
  .set button{flex:1;padding:11px;border-radius:10px;border:none;font:inherit;font-family:var(--ar);cursor:pointer}
  .set .save{background:var(--amber);color:#1a1206;font-weight:600}
  .set .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim)}
  .bal{font-family:var(--ar);font-size:.82rem;color:var(--amber-soft);margin-top:8px;min-height:1.2em}
  .banner{max-width:680px;margin:14px auto 0;padding:11px 14px;border:1px solid var(--line);
    background:rgba(233,180,76,.06);border-radius:12px;font-size:.84rem;color:var(--ink-dim);line-height:1.6;font-family:var(--ar);direction:rtl;text-align:right}
  .banner b{color:var(--amber-soft)} .banner u{cursor:pointer;color:var(--amber)}
</style>
</head>
<body class="no-ar">

<header>
  <div class="brand">
    <div class="l"><h1>Yusuf</h1><span class="ar">يوسف — مدرّب القراءة والاستماع</span></div>
    <button class="gear" id="openSet" title="الإعدادات"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 0-1.88l2-1.56-2-3.46-2.36.95a7.3 7.3 0 0 0-1.62-.94L14.8 2.5h-4l-.36 2.55c-.58.23-1.12.55-1.62.94L6.46 5.0l-2 3.46 2 1.56a7.5 7.5 0 0 0 0 1.88l-2 1.56 2 3.46 2.36-.95c.5.39 1.04.71 1.62.94l.36 2.55h4l.36-2.55c.58-.23 1.12-.55 1.62-.94l2.36.95 2-3.46-2-1.56zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
  <div class="tools">
    <button class="chip" id="tAr"><span class="dot"></span> العربية</button>
    <label class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12h18M3 6h18M3 18h18"/></svg><select id="jump"></select></label>
    <div class="chip speedchip" title="السرعة — اسحب يمين أبطأ، يسار أسرع">
      <span class="splabel">سرعة <b id="spVal">×1.0</b></span>
      <input type="range" id="sp" min="0" max="100" step="5" value="50" dir="ltr">
      <span class="sphint">إنجليزي فقط</span>
    </div>
    <button class="chip" id="tRepeat"><span class="dot"></span> تكرار الجملة</button>
  </div>
</header>

<main id="main"><div class="wrap" id="reader"></div></main>

<div class="bar">
  <div class="prog"><i id="progFill"></i></div>
  <div class="ctrls">
    <div class="meta" id="meta">جاهز للتشغيل</div>
    <button class="btn" id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn" id="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="word"><h3 id="sWord"></h3>
    <button class="spk" id="sSpk"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-9v2.06A7 7 0 0 1 14 21v-2.06A5 5 0 0 0 14 3z"/></svg></button>
  </div>
  <div class="mean" id="sMean"></div>
  <div class="def" id="sDef"></div>
</div>

<div class="sheet set" id="setSheet">
  <div class="grab"></div>
  <h3>الإعدادات</h3>
  <label>مفتاح ElevenLabs API</label>
  <input id="iKey" type="password" placeholder="sk_..." autocomplete="off">
  <div class="row">
    <div><label>صوت الإنجليزي (Voice ID)</label><input id="iVEn" placeholder="21m00Tcm4TlvDq8ikWAM"></div>
    <div><label>صوت العربي (Voice ID)</label><input id="iVAr" placeholder="(اتركه فاضي = نفس الإنجليزي)"></div>
  </div>
  <label>النموذج</label>
  <select id="iModel">
    <option value="eleven_flash_v2_5">Flash v2.5 — الأرخص (0.5 كريدت/حرف)</option>
    <option value="eleven_multilingual_v2">Multilingual v2 — أجود (1 كريدت/حرف)</option>
  </select>
  <div class="bal" id="bal"></div>
  <div class="note">🔒 مفتاحك ينحفظ في هذا الجهاز فقط وما يُرفع مع الملف على GitHub. للأمان: سوِّ مفتاحًا <b>مقيّدًا بحد كريدت</b> + صلاحية Text-to-Speech فقط من لوحة ElevenLabs. الصوت المُولّد ينحفظ بجوالك، فما ينخصم كريدت عند الإعادة.</div>
  <div class="acts">
    <button class="ghost" id="checkBal">تحقق من الرصيد</button>
    <button class="ghost" id="clearCache">مسح الصوت المحفوظ</button>
    <button class="save" id="saveSet">حفظ</button>
  </div>
</div>

<audio id="au" preload="auto"></audio>

<script id="storyData" type="application/json">{
 "title": "Yusuf — A Reading & Listening Trainer",
 "title_ar": "يوسف — مدرّب القراءة والاستماع",
 "chapters": [
  {
   "id": 1,
   "title_en": "CHAPTER ONE — The Spark",
   "title_ar": "الْفَصْلُ الْأَوَّلُ — الشَّرَارَةُ",
   "sentences": [
    {
     "id": "1-1",
     "en": "Yusuf grew up in a small, dusty town where almost nothing ever changed.",
     "ar": "نَشَأَ يُوسُفُ فِي بَلْدَةٍ صَغِيرَةٍ وَمُغْبَرَّةٍ، حَيْثُ لَمْ يَكُنْ يَتَغَيَّرُ فِيهَا شَيْءٌ تَقْرِيبًا."
    },
    {
     "id": "1-2",
     "en": "His family was modest, and money was always scarce, so every coin had to be spent with care.",
     "ar": "كَانَتْ عَائِلَتُهُ مُتَوَاضِعَةَ الْحَالِ، وَكَانَ الْمَالُ شَحِيحًا دَائِمًا، لِذَلِكَ كَانَ يَجِبُ إِنْفَاقُ كُلِّ قِطْعَةٍ نَقْدِيَّةٍ بِحَذَرٍ."
    },
    {
     "id": "1-3",
     "en": "Yet from a young age he carried a quiet ambition that he could not fully explain.",
     "ar": "وَمَعَ ذَلِكَ، كَانَ يَحْمِلُ مُنْذُ صِغَرِهِ طُمُوحًا هَادِئًا لَا يَسْتَطِيعُ تَفْسِيرَهُ بِالْكَامِلِ."
    },
    {
     "id": "1-4",
     "en": "While the other children were content to pursue simple games in the street, Yusuf would aspire to something larger, though even he could not yet name it.",
     "ar": "بَيْنَمَا كَانَ الْأَطْفَالُ الْآخَرُونَ يَكْتَفُونَ بِمُمَارَسَةِ أَلْعَابٍ بَسِيطَةٍ فِي الشَّارِعِ، كَانَ يُوسُفُ يَتَطَلَّعُ إِلَى شَيْءٍ أَكْبَرَ، رَغْمَ أَنَّهُ هُوَ نَفْسَهُ لَمْ يَكُنْ يَسْتَطِيعُ تَسْمِيَتَهُ بَعْدُ."
    },
    {
     "id": "1-5",
     "en": "The dream was still vague, like a shape moving behind fog.",
     "ar": "كَانَ الْحُلْمُ لَا يَزَالُ غَامِضًا، مِثْلَ شَكْلٍ يَتَحَرَّكُ خَلْفَ الضَّبَابِ."
    },
    {
     "id": "1-6",
     "en": "What set him apart was not talent but curiosity.",
     "ar": "مَا مَيَّزَهُ عَنْ غَيْرِهِ لَمْ يَكُنِ الْمَوْهِبَةَ، بَلِ الْفُضُولَ."
    },
    {
     "id": "1-7",
     "en": "He was eager to understand how everything worked, from the old radio in the kitchen to the stars above the desert.",
     "ar": "كَانَ مُتَلَهِّفًا لِفَهْمِ كَيْفَ يَعْمَلُ كُلُّ شَيْءٍ، مِنَ الرَّادِيُو الْقَدِيمِ فِي الْمَطْبَخِ إِلَى النُّجُومِ فَوْقَ الصَّحْرَاءِ."
    },
    {
     "id": "1-8",
     "en": "To most people he seemed an ordinary boy, but those who watched closely sensed something remarkable in the way he asked questions.",
     "ar": "بِالنِّسْبَةِ لِمُعْظَمِ النَّاسِ، كَانَ يَبْدُو وَلَدًا عَادِيًّا، لَكِنْ مَنْ كَانُوا يُرَاقِبُونَهُ عَنْ قُرْبٍ شَعَرُوا بِوُجُودِ شَيْءٍ مُمَيَّزٍ فِي طَرِيقَةِ طَرْحِهِ لِلْأَسْئِلَةِ."
    },
    {
     "id": "1-9",
     "en": "His teacher once said that the child had real potential, that he was capable of far more than the town could offer.",
     "ar": "قَالَ مُعَلِّمُهُ ذَاتَ مَرَّةٍ إِنَّ هَذَا الطِّفْلَ لَدَيْهِ إِمْكَانَاتٌ حَقِيقِيَّةٌ، وَإِنَّهُ قَادِرٌ عَلَى مَا هُوَ أَكْبَرُ بِكَثِيرٍ مِمَّا تَسْتَطِيعُ الْبَلْدَةُ أَنْ تُقَدِّمَهُ لَهُ."
    },
    {
     "id": "1-10",
     "en": "Yusuf decided early that he would devote himself to learning.",
     "ar": "قَرَّرَ يُوسُفُ مُنْذُ وَقْتٍ مُبَكِّرٍ أَنْ يُكَرِّسَ نَفْسَهُ لِلتَّعَلُّمِ."
    },
    {
     "id": "1-11",
     "en": "He made a private promise to commit to a single goal: to build a life that mattered.",
     "ar": "قَطَعَ عَلَى نَفْسِهِ وَعْدًا خَاصًّا بِأَنْ يَلْتَزِمَ بِهَدَفٍ وَاحِدٍ: أَنْ يَبْنِيَ حَيَاةً ذَاتَ قِيمَةٍ."
    },
    {
     "id": "1-12",
     "en": "He understood that this would demand sacrifice.",
     "ar": "كَانَ يَفْهَمُ أَنَّ ذَلِكَ سَيَتَطَلَّبُ التَّضْحِيَةَ."
    },
    {
     "id": "1-13",
     "en": "To persevere through long, lonely nights, and to strive when others rested, he would need to be relentless.",
     "ar": "وَلِكَيْ يُثَابِرَ خِلَالَ اللَّيَالِي الطَّوِيلَةِ وَالْوَحِيدَةِ، وَيَجْتَهِدَ عِنْدَمَا يَسْتَرِيحُ الْآخَرُونَ، كَانَ عَلَيْهِ أَنْ يَكُونَ إِنْسَانًا لَا يَلِينُ."
    },
    {
     "id": "1-14",
     "en": "So he built a strict discipline around himself, a daily routine that slowly became a habit.",
     "ar": "لِذَلِكَ بَنَى حَوْلَ نَفْسِهِ نِظَامًا صَارِمًا، وَرُوتِينًا يَوْمِيًّا تَحَوَّلَ بِبُطْءٍ إِلَى عَادَةٍ."
    },
    {

<script>
const $=s=>document.querySelector(s);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const STORY=JSON.parse($('#storyData').textContent);
const GLOSS=JSON.parse($('#glossData').textContent);

let SEG=[],idx=0,playing=false,engine=null,curURL=null,playToken=0;
let speed=parseFloat(store.get('speed')||'1');
let bilingual=store.get('ar')==='1';
let repeat=store.get('rep')==='1';
const au=$('#au');

/* ---------- settings accessors ---------- */
const getKey=()=>store.get('key')||'';
const getVEn=()=>store.get('vEn')||'21m00Tcm4TlvDq8ikWAM';
const getVAr=()=>store.get('vAr')||getVEn();
const getModel=()=>store.get('model')||'eleven_flash_v2_5';
const voiceFor=l=>l==='ar'?getVAr():getVEn();
const rate=()=>getModel()==='eleven_multilingual_v2'?1:0.5;

/* ---------- IndexedDB cache ---------- */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('yusufAudio',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('clips').objectStore('clips').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});}
async function idbPut(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbClear(){const db=await idbOpen();return new Promise(res=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').clear();tx.oncomplete=()=>res();});}
const hashTxt=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36);};
const cacheKey=seg=>`${seg.sid}|${seg.lang}|${voiceFor(seg.lang)}|${getModel()}|${hashTxt(seg.text)}`;

/* ---------- ElevenLabs ---------- */
function wordsFromAlignment(al){
  if(!al)return[];
  const c=al.characters,s=al.character_start_times_seconds,e=al.character_end_times_seconds;
  const out=[];let cur='',cs=null,ce=null;
  for(let i=0;i<c.length;i++){const ch=c[i];
    if(/\s/.test(ch)){if(cur){out.push({w:cur,s:+cs.toFixed(3),e:+ce.toFixed(3)});cur='';}}
    else{if(!cur)cs=s[i];cur+=ch;ce=e[i];}}
  if(cur)out.push({w:cur,s:+cs.toFixed(3),e:+ce.toFixed(3)});
  return out;
}
async function genClip(seg){
  const key=getKey(); if(!key) throw{code:0,msg:'no-key'};
  const voice=voiceFor(seg.lang);
  const url=`https://api.elevenlabs.io/v1/text-to-speech/${voice}/with-timestamps?output_format=mp3_44100_128`;
  let res;
  try{
    res=await fetch(url,{method:'POST',headers:{'xi-api-key':key,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({text:seg.text,model_id:getModel(),voice_settings:{stability:.5,similarity_boost:.75}})});
  }catch(e){ throw{code:-1,msg:'network/CORS'}; }
  if(!res.ok){ let t='';try{t=await res.text()}catch(e){}; throw{code:res.status,msg:t}; }
  const data=await res.json();
  const bytes=Uint8Array.from(atob(data.audio_base64),ch=>ch.charCodeAt(0));
  const blob=new Blob([bytes],{type:'audio/mpeg'});
  const words=wordsFromAlignment(data.alignment||data.normalized_alignment);
  const clip={blob,words,dur:words.length?words[words.length-1].e:0};
  await idbPut(cacheKey(seg),clip);
  return clip;
}
function handleGenErr(e){
  let m='تعذّر توليد الصوت';
  if(e.code===401||e.code===403) m='المفتاح غير صحيح أو غير مصرّح';
  else if(e.code===422) m='Voice ID غير صالح — صحّحه في الإعدادات';
  else if(e.code===429||e.code===402) m='انتهى الكريدت أو تجاوزت الحد';
  else if(e.code===-1) m='تعذّر الاتصال (CORS/شبكة) — جرّب من الموقع المرفوع لا من ملف محلي';
  setMeta('⚠️ '+m);
}

/* ---------- render ---------- */
function chTitle(c){return (c.title_en.split('—')[1]||c.title_en).trim();}
function render(){
  const r=$('#reader'),jump=$('#jump');
  STORY.chapters.forEach(c=>{
    const head=document.createElement('div');head.className='chap';head.id='ch'+c.id;
    head.innerHTML=`<div class="n">${(c.title_en.split('—')[0]||'').trim()}</div><h2>${chTitle(c)}</h2><div class="h-ar">${c.title_ar}</div>`;
    const btn=document.createElement('button');btn.className='dl';btn.textContent='⤓ تحميل الفصل';
    btn.onclick=()=>dlChapter(c,btn); head.appendChild(btn); r.appendChild(head);
    const opt=document.createElement('option');opt.value='ch'+c.id;opt.textContent=chTitle(c);jump.appendChild(opt);
    c.sentences.forEach(s=>{
      const seg=document.createElement('div');seg.className='seg';seg.id='s'+s.id;
      const en=document.createElement('p');en.className='en';en.appendChild(tokenize(s));
      const ar=document.createElement('p');ar.className='ar';ar.textContent=s.ar;
      seg.appendChild(en);seg.appendChild(ar);r.appendChild(seg);
    });
  });
  jump.onchange=e=>document.getElementById(e.target.value)?.scrollIntoView();
}
function tokenize(s){
  const frag=document.createDocumentFragment();
  s.en.split(/\s+/).forEach(w=>{
    const sp=document.createElement('span');sp.className='w';sp.textContent=w;sp.onclick=()=>openWord(w);
    frag.appendChild(sp);frag.appendChild(document.createTextNode(' '));
  });
  return frag;
}

/* ---------- playlist ---------- */
function buildPlaylist(){
  const cur=SEG[idx];SEG=[];
  STORY.chapters.forEach(c=>c.sentences.forEach(s=>{
    SEG.push({sid:s.id,lang:'en',ch:c,text:s.en});
    if(bilingual)SEG.push({sid:s.id,lang:'ar',ch:c,text:s.ar});
  }));
  if(cur){const j=SEG.findIndex(x=>x.sid===cur.sid&&x.lang==='en');idx=j>=0?j:Math.min(idx,SEG.length-1);}
}

/* ---------- play ---------- */
async function playSeg(i){
  const tok=++playToken; stopHighlight(); cancelTTS(); au.pause();
  if(i<0||i>=SEG.length){stop();return;}
  idx=i; const seg=SEG[idx]; markActive(seg); setMedia(seg); store.set('pos',seg.sid);
  let clip=null; try{clip=await idbGet(cacheKey(seg));}catch(e){}
  if(tok!==playToken)return;
  if(!clip&&seg.lang==='en'&&getKey()){ setMeta('⏳ يولّد ويُحفظ بالجوال…');
    try{clip=await genClip(seg);}catch(e){handleGenErr(e);} if(tok!==playToken)return; }
  if(clip)playClip(clip,seg); else speak(seg);
}
function playClip(clip,seg){
  if(curURL)URL.revokeObjectURL(curURL); curURL=URL.createObjectURL(clip.blob);
  engine='audio'; au.src=curURL; au.playbackRate=(seg.lang==='en'?speed:1);
  au.play().then(()=>{playing=true;setPlayIcon();runHighlight(seg,clip);}).catch(()=>{playing=false;setPlayIcon();});
}
au.onended=()=>{ if(!playing)return; if(repeat){playSeg(idx);} else playSeg(idx+1); };

/* ---------- browser-voice fallback ---------- */
let utter=null,voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(lang){const p=lang.split('-')[0];return voices.find(v=>v.lang===lang)||voices.find(v=>v.lang.startsWith(p));}
function speak(seg){
  if(!('speechSynthesis' in window)){playSeg(idx+1);return;}
  utter=new SpeechSynthesisUtterance(seg.text);utter.lang=seg.lang==='ar'?'ar-SA':'en-US';utter.rate=(seg.lang==='en'?speed:1);
  const v=pickVoice(utter.lang);if(v)utter.voice=v;
  const spans=[...document.querySelectorAll(`#s${seg.sid} .w`)];
  if(seg.lang==='en'&&spans.length){const offs=wordOffsets(seg.text);
    utter.onboundary=e=>{if(e.name==='word'){const wi=offs.findIndex((o,k)=>e.charIndex>=o&&(k===offs.length-1||e.charIndex<offs[k+1]));hi(spans,wi);}};}
  utter.onend=()=>{clearHi(spans); if(!playing)return; if(repeat)playSeg(idx); else playSeg(idx+1);};
  engine='tts'; playing=true; setPlayIcon(); speechSynthesis.cancel(); speechSynthesis.speak(utter);
}
function wordOffsets(t){const o=[];let m,re=/\S+/g;while(m=re.exec(t))o.push(m.index);return o;}
function cancelTTS(){if('speechSynthesis' in window)speechSynthesis.cancel();utter=null;}

/* ---------- highlight ---------- */
let raf=null,lastScroll=0;
function runHighlight(seg,clip){
  const spans=[...document.querySelectorAll(`#s${seg.sid} .w`)],words=clip.words||[];
  const tick=()=>{const t=au.currentTime;let cur=-1;
    for(let k=0;k<words.length;k++){if(t>=words[k].s&&t<=words[k].e){cur=k;break;}if(t>words[k].e)cur=k;}
    hi(spans,cur); if(clip.dur)$('#progFill').style.width=Math.min(100,(t/clip.dur)*100)+'%';
    if(navigator.mediaSession?.setPositionState&&clip.dur){try{navigator.mediaSession.setPositionState({duration:clip.dur,position:Math.min(t,clip.dur),playbackRate:speed});}catch(e){}}
    raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);
}
function stopHighlight(){if(raf)cancelAnimationFrame(raf);raf=null;document.querySelectorAll('.w.active').forEach(w=>w.classList.remove('active'));}
function hi(spans,i){spans.forEach((s,k)=>s.classList.toggle('active',k===i));if(i>=0&&spans[i])ensureVisible(spans[i]);}
function clearHi(spans){spans.forEach(s=>s.classList.remove('active'));}
function markActive(seg){document.querySelectorAll('.seg.active').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('s'+seg.sid);if(el){el.classList.add('active');el.scrollIntoView({block:'center',behavior:'smooth'});}}
function ensureVisible(sp){const now=Date.now();if(now-lastScroll<450)return;const r=sp.getBoundingClientRect();
  if(r.top<90||r.bottom>innerHeight-180){sp.scrollIntoView({block:'center',behavior:'smooth'});lastScroll=now;}}

/* ---------- transport ---------- */
function toggle(){playing?pause():resume();}
function resume(){
  if(engine==='audio'&&au.src&&au.paused&&au.currentTime>0){au.play();playing=true;setPlayIcon();
    const seg=SEG[idx];idbGet(cacheKey(seg)).then(c=>{if(c)runHighlight(seg,c);});}
  else playSeg(idx);
}
function pause(){playing=false;setPlayIcon();if(engine==='audio')au.pause();else cancelTTS();stopHighlight();}
function stop(){playing=false;setPlayIcon();setMeta('انتهى');}
function setPlayIcon(){$('#playIcon').setAttribute('d',playing?'M6 5h4v14H6zm8 0h4v14h-4z':'M8 5v14l11-7z');}
function setMeta(t){$('#meta').textContent=t;}
$('#play').onclick=toggle;$('#next').onclick=()=>playSeg(idx+1);$('#prev').onclick=()=>playSeg(idx-1);
$('#tAr').onclick=()=>{bilingual=!bilingual;store.set('ar',bilingual?'1':'0');document.body.classList.toggle('no-ar',!bilingual);
  $('#tAr').classList.toggle('on',bilingual);const w=playing;pause();buildPlaylist();if(w)playSeg(idx);};
function fmtSpeed(v){return '×'+(Math.round(v*100)/100).toString();}
function applySpeed(){const seg=SEG[idx];const r=(seg&&seg.lang==='en')?speed:1;if(au)au.playbackRate=r;if(utter)utter.rate=r;}
$('#sp').oninput=(e)=>{ // value 0=left=fast(1.5) .. 100=right=slow(0.5)
  speed=Math.round((1.5-(+e.target.value)/100)*100)/100;
  store.set('speed',speed);$('#spVal').textContent=fmtSpeed(speed);applySpeed();};
$('#tRepeat').onclick=()=>{repeat=!repeat;store.set('rep',repeat?'1':'0');$('#tRepeat').classList.toggle('on',repeat);};

/* ---------- media session ---------- */
function setMedia(seg){
  $('#meta').innerHTML='<b>'+chTitle(seg.ch)+'</b> · '+(seg.lang==='ar'?'عربي':'English');
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:chTitle(seg.ch),artist:'Yusuf — Reading Trainer',album:STORY.title_ar});
  navigator.mediaSession.playbackState='playing';
}
if('mediaSession' in navigator){const ms=navigator.mediaSession;
  ms.setActionHandler('play',resume);ms.setActionHandler('pause',pause);
  ms.setActionHandler('previoustrack',()=>playSeg(idx-1));ms.setActionHandler('nexttrack',()=>playSeg(idx+1));
  ms.setActionHandler('seekforward',()=>playSeg(idx+1));ms.setActionHandler('seekbackward',()=>playSeg(idx-1));}

/* ---------- download a chapter ---------- */
async function dlChapter(c,btn){
  if(!getKey()){openSettings();return;}
  const langs=['en']; // الإنجليزي فقط — العربي صوت جهاز مجاني
  const chars=c.sentences.reduce((a,s)=>a+langs.reduce((b,l)=>b+s[l].length,0),0);
  if(!confirm(`تحميل «${chTitle(c)}» (إنجليزي فلاش) ≈ ${Math.round(chars*rate())} كريدت؟\n(العربي مجاني، والمحفوظ مسبقًا ما ينخصم)`))return;
  const total=c.sentences.length*langs.length;let done=0;
  for(const s of c.sentences){for(const l of langs){done++;
    const seg={sid:s.id,lang:l,ch:c,text:s[l]};btn.textContent=`⏳ ${done}/${total}`;
    try{let cl=await idbGet(cacheKey(seg));if(!cl)await genClip(seg);}
    catch(e){handleGenErr(e);btn.textContent='⚠️ خطأ — اضغط للإعادة';return;}
  }}
  btn.textContent='✓ محفوظ في الجوال';btn.classList.add('done');
}

/* ---------- word sheet ---------- */
function showSheet(el,b){el.classList.toggle('show',b);$('#scrim').classList.toggle('show',b);}
function clean(w){return w.toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g,'');}
function lemma(w){if(GLOSS[w])return w;
  const t=[w,w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ies$/,'y'),w.replace(/ed$/,''),w.replace(/ed$/,'e'),
    w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ly$/,''),w.replace(/(.)\1ed$/,'$1'),w.replace(/(.)\1ing$/,'$1')];
  return t.find(x=>GLOSS[x])||w;}
async function openWord(raw){
  const w=clean(raw);if(!w)return;$('#sWord').textContent=w;const base=lemma(w);
  $('#sMean').textContent=GLOSS[base]||'…';$('#sDef').innerHTML='';showSheet($('#sheet'),true);pronounce(w);
  try{const d=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(base)).then(r=>r.json());
    const m=d?.[0]?.meanings?.[0],def=m?.definitions?.[0]?.definition;
    if(def)$('#sDef').innerHTML='<i>'+(m.partOfSpeech||'')+'</i><br>'+def;
    if(!GLOSS[base]&&!def)$('#sMean').textContent='—';
  }catch(e){if(!GLOSS[base])$('#sMean').textContent='—';}
}
function pronounce(w){if(!('speechSynthesis' in window))return;const wasP=playing;if(wasP)pause();
  const u=new SpeechSynthesisUtterance(w);u.lang='en-US';const v=pickVoice('en-US');if(v)u.voice=v;u.rate=.9;
  speechSynthesis.cancel();speechSynthesis.speak(u);}
$('#sSpk').onclick=()=>pronounce($('#sWord').textContent);

/* ---------- settings sheet ---------- */
function openSettings(){
  $('#iKey').value=getKey();$('#iVEn').value=store.get('vEn')||'';$('#iVAr').value=store.get('vAr')||'';
  $('#iModel').value=getModel();$('#bal').textContent='';showSheet($('#setSheet'),true);
}
$('#openSet').onclick=openSettings;
$('#saveSet').onclick=()=>{store.set('key',$('#iKey').value.trim());store.set('vEn',$('#iVEn').value.trim());
  store.set('vAr',$('#iVAr').value.trim());store.set('model',$('#iModel').value);showSheet($('#setSheet'),false);};
$('#clearCache').onclick=async()=>{if(confirm('مسح كل الصوت المحفوظ من الجوال؟')){await idbClear();$('#bal').textContent='تم مسح الصوت المحفوظ.';}};
$('#checkBal').onclick=async()=>{const k=$('#iKey').value.trim()||getKey();if(!k){$('#bal').textContent='حط المفتاح أول.';return;}
  $('#bal').textContent='…';
  try{const d=await fetch('https://api.elevenlabs.io/v1/user/subscription',{headers:{'xi-api-key':k}}).then(r=>r.json());
    const left=(d.character_limit-d.character_count);$('#bal').textContent='المتبقي تقريبًا: '+left.toLocaleString()+' كريدت';}
  catch(e){$('#bal').textContent='تعذّر جلب الرصيد (قد يكون CORS).';}};
$('#scrim').onclick=()=>{showSheet($('#sheet'),false);showSheet($('#setSheet'),false);};

/* ---------- boot ---------- */
function banner(){const b=document.createElement('div');b.className='banner';
  b.innerHTML='👋 ابدأ: افتح <b>⚙️ الإعدادات</b> وحط مفتاح ElevenLabs، بعدها شغّل أو اضغط <b>«⤓ تحميل الفصل»</b>. الإنجليزي بفلاش (يسحب كريدت)، والعربي بصوت جهازك <b>مجاني</b>. الصوت ينحفظ بجوالك وما ينخصم عند الإعادة. <u id="bset">افتح الإعدادات</u>';
  $('#reader').prepend(b);$('#bset').onclick=openSettings;}
function restore(){const sid=store.get('pos');if(!sid)return;const j=SEG.findIndex(x=>x.sid===sid&&x.lang==='en');
  if(j>=0){idx=j;setMedia(SEG[idx]);document.getElementById('s'+sid)?.scrollIntoView({block:'center'});}}
au.addEventListener('play',()=>{const seg=SEG[idx];au.playbackRate=(seg&&seg.lang==='en')?speed:1;});

document.body.classList.toggle('no-ar',!bilingual);
$('#tAr').classList.toggle('on',bilingual);
$('#tRepeat').classList.toggle('on',repeat);
$('#spVal').textContent=fmtSpeed(speed);$('#sp').value=String(Math.round((1.5-speed)*100));
render();buildPlaylist();restore();
if(!getKey())banner();
</script>
</body>
</html>
